<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detached</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header><h1>Detached</h1></header>
      <p id="status" role="status">Looking for media…</p>
      <form hidden>
        <div class="track">
          <p id="title"></p>
          <p id="next" hidden></p>
        </div>
        <label id="media-picker" hidden>
          Media on this tab
          <select id="media" required></select>
        </label>
        <fieldset>
          <legend>Player view</legend>
          <div class="views">
            <label><input type="radio" name="view" value="video"> <span>Video</span></label>
            <label><input type="radio" name="view" value="artwork"> <span>Artwork</span></label>
            <label><input type="radio" name="view" value="compact"> <span>Compact</span></label>
          </div>
        </fieldset>
        <button type="submit">Open player</button>
      </form>
      <div class="actions">
        <button id="embed" type="button" hidden>Open embedded player in a tab</button>
        <button id="refresh" type="button" hidden>Scan again</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
